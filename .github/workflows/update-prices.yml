name: Atualizar preços

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia às 06:17 no horário de Brasília
  workflow_dispatch:        # permite rodar na mão pela aba Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar preços
        run: python scripts/update_prices.py

      - name: Salvar alterações
        run: |
          if [ -n "$(git status --porcelain data/games.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/games.json
            git commit -m "Atualiza preços"
            git push
          fi
