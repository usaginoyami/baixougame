name: Atualizar preços

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia às 06:17 no horário de Brasília
  workflow_dispatch:        # permite rodar na mão pela aba Actions

permissions:
  contents: write

# Fila única com o workflow "Adicionar jogo", para não mexerem nos dados ao mesmo tempo.
concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descobrir jogos e buscar preços
        run: python scripts/update_prices.py

      - name: Gerar páginas dos jogos
        continue-on-error: true   # se falhar, os preços ainda são salvos
        run: python scripts/build_pages.py

      - name: Salvar alterações
        run: |
          if [ -n "$(git status --porcelain data/ jogos/ sitemap.xml robots.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ jogos/ sitemap.xml robots.txt
            git commit -m "Atualiza preços e jogos"
            git push
          fi
