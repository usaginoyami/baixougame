name: Atualizar estrelas do Recomp

# Coleta estrelas, último push e última release dos projetos listados em /recomp/.
# O catálogo vem do Usagi Game Launcher; este workflow só grava data/recomp-stats.json.
on:
  schedule:
    - cron: "43 9 * * *"   # todo dia às 06:43 no horário de Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar estatísticas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_recomp.py

      - name: Salvar alterações
        run: |
          if [ -n "$(git status --porcelain data/recomp-stats.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/recomp-stats.json
            git commit -m "Atualiza estatísticas do Recomp"
            git pull --rebase -q origin main
            git push
          fi
